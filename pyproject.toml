[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evidencebench"
version = "0.1.0"
description = "Reproducible document retrieval and reranking experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pdfplumber>=0.11,<0.12",
  "pyarrow>=19,<24",
  "PyYAML>=6,<7",
  "httpx>=0.28,<0.29",
  "numpy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "python-dotenv>=1,<2",
]

[project.scripts]
evidencebench = "evidencebench.cli:main"

[project.optional-dependencies]
ml = [
    "huggingface-hub>=0.34,<2",
    "sentence-transformers>=5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: requires a real external dependency", "model: downloads and runs pinned models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
