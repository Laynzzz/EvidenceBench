name: evidencebench
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: evidencebench
      POSTGRES_DB: evidencebench
      POSTGRES_PASSWORD: ${EVIDENCEBENCH_DB_PASSWORD:?Run scripts/setup_local.py first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencebench -d evidencebench"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 2
volumes:
  postgres-data:
